    <circle cx="380" cy="928" r="12"/>
    <circle cx="424" cy="928" r="12"/>
    <path d="M 380 928 l 10 -21 h 15 l 15 21 M 386 907 h -9 M 398 928 h 20 l -7 -18"/>
  </g>
  <text x="402" y="966" font-size="12" font-weight="600" fill="#5F8FB4" text-anchor="middle">mit dem Rad</text>

  <!-- ================= Route ================= -->
  <!-- 1 -> Haupteingang: Arbeitsweg (gestrichelt) -->
  <path d="M 360 878 C 392 878, 418 878, 446 878" fill="none" stroke="#5F8FB4" stroke-width="3.5" stroke-dasharray="9 8" marker-end="url(#pfDunkel)"/>
  <!-- Haupteingang -> 2 -->
  <path d="M 470 878 C 560 882, 630 882, 698 880" fill="none" stroke="#86BC25" stroke-width="3.5" marker-end="url(#pf)"/>
  <!-- 2 -> 3: durch die Gasse zum Platz -->
  <path d="M 720 858 C 722 800, 740 700, 806 632" fill="none" stroke="#86BC25" stroke-width="3.5" marker-end="url(#pf)"/>
  <!-- 3 -> 4: Platz -> Besprechung -->
  <path d="M 820 594 C 782 520, 762 480, 742 436" fill="none" stroke="#86BC25" stroke-width="3.5" marker-end="url(#pf)"/>
  <!-- 4 -> 5: Besprechung -> Kabine -->
  <path d="M 754 402 C 788 376, 800 368, 815 352" fill="none" stroke="#86BC25" stroke-width="3.5" marker-end="url(#pf)"/>
  <!-- 5 -> 6: Kabine -> Werkraum -->
  <path d="M 854 348 C 940 402, 1040 428, 1128 416" fill="none" stroke="#86BC25" stroke-width="3.5" marker-end="url(#pf)"/>
  <!-- 6 -> 7: Werkraum -> zurück an den Platz -->
  <path d="M 1146 430 C 1130 500, 1090 560, 1049 596" fill="none" stroke="#86BC25" stroke-width="3.5" marker-end="url(#pf)"/>
  <!-- 7 -> Aufzug -->
  <path d="M 1050 626 C 1140 652, 1220 640, 1306 622" fill="none" stroke="#86BC25" stroke-width="3.5" marker-end="url(#pf)"/>
