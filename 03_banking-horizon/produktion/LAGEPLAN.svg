  <text x="920" y="500" font-size="13" letter-spacing="3" fill="#41608A" text-anchor="middle">OFFENE OPERATIONS-FLÄCHE</text>
  <g>
    <rect x="832" y="572" width="188" height="76" rx="8" fill="#142842" stroke="#33517A" stroke-width="1.8"/>
    <g stroke="#3D5C84" stroke-width="2" fill="none">
