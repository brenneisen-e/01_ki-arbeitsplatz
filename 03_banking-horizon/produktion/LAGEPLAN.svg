<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1060" font-family="'DM Sans','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#86BC25"/>
    </marker>
    <marker id="pfDunkel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F8FB4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="1060" fill="#0B1626"/>

  <!-- Kopf -->
  <text x="60" y="66" font-size="30" font-weight="700" fill="#F2F7FC">Lageplan — Ein Tag in Banking Operations 2030</text>
  <text x="60" y="98" font-size="16" fill="#9FB2C8">Maras Weg durch das Haus, 07:00–17:00 · Stationen und Uhrzeiten wie in der App (/v04, /v05)</text>

  <!-- ================= Legende (oben links) ================= -->
  <g>
    <rect x="60" y="140" width="360" height="580" rx="14" fill="#0F1E33" stroke="#2A4361" stroke-width="2"/>
    <text x="84" y="176" font-size="17" font-weight="700" fill="#F2F7FC">Stationen des Tages</text>
    <g font-size="13" fill="#C4D6E9">
      <g><circle cx="98" cy="212" r="11" fill="#86BC25"/><text x="98" y="217" font-size="12" font-weight="700" fill="#0B1626" text-anchor="middle">1</text>
        <text x="120" y="208" font-weight="700" fill="#F2F7FC">07:00 · Wohnung</text>
        <text x="120" y="226">Overnight-Briefing auf dem Handy,</text>
        <text x="120" y="243">dann mit dem Rad zur Bank</text></g>
      <g><circle cx="98" cy="278" r="11" fill="#86BC25"/><text x="98" y="283" font-size="12" font-weight="700" fill="#0B1626" text-anchor="middle">2</text>
        <text x="120" y="274" font-weight="700" fill="#F2F7FC">07:45 · Eingangshalle <tspan fill="#8AA4C0" font-weight="400">(s0)</tspan></text>
        <text x="120" y="292">Check-in an der Schranke,</text>
        <text x="120" y="309">die ihre Smartwatch kennt</text></g>
      <g><circle cx="98" cy="344" r="11" fill="#86BC25"/><text x="98" y="349" font-size="12" font-weight="700" fill="#0B1626" text-anchor="middle">3</text>
        <text x="120" y="340" font-weight="700" fill="#F2F7FC">08:00–08:15 · Arbeitsplatz <tspan fill="#8AA4C0" font-weight="400">(s1–s3)</tspan></text>
        <text x="120" y="358">Präventions-Feed, Kundenmoment,</text>
        <text x="120" y="375">Kundenkacheln, Behördenanfrage</text></g>
      <g><circle cx="98" cy="410" r="11" fill="#86BC25"/><text x="98" y="415" font-size="12" font-weight="700" fill="#0B1626" text-anchor="middle">4</text>
        <text x="120" y="406" font-weight="700" fill="#F2F7FC">09:00 · Besprechungsraum <tspan fill="#8AA4C0" font-weight="400">(s4)</tspan></text>
        <text x="120" y="424">Agent-Team-Review</text>
        <text x="120" y="441">am Breitdisplay über den Köpfen</text></g>
      <g><circle cx="98" cy="476" r="11" fill="#86BC25"/><text x="98" y="481" font-size="12" font-weight="700" fill="#0B1626" text-anchor="middle">5</text>
        <text x="120" y="472" font-weight="700" fill="#F2F7FC">10:30 / 11:15 · Fokus-Kabine <tspan fill="#8AA4C0" font-weight="400">(s5–s6)</tspan></text>
        <text x="120" y="490">Decision Trace statt Prozesskarte,</text>
        <text x="120" y="507">Zertifizierung der Entscheidungslogik</text></g>
      <g><circle cx="98" cy="542" r="11" fill="#86BC25"/><text x="98" y="547" font-size="12" font-weight="700" fill="#0B1626" text-anchor="middle">6</text>
        <text x="120" y="538" font-weight="700" fill="#F2F7FC">14:00 · Werkraum <tspan fill="#8AA4C0" font-weight="400">(s7)</tspan></text>
        <text x="120" y="556">Kontrolle wandert in die Entscheidung</text>
        <text x="120" y="573">(Collection Recovery Workout)</text></g>
      <g><circle cx="98" cy="608" r="11" fill="#86BC25"/><text x="98" y="613" font-size="12" font-weight="700" fill="#0B1626" text-anchor="middle">7</text>
        <text x="120" y="604" font-weight="700" fill="#F2F7FC">15:30 / 16:00 · Arbeitsplatz <tspan fill="#8AA4C0" font-weight="400">(s8–s9)</tspan></text>
        <text x="120" y="622">Agent als Interface,</text>
        <text x="120" y="639">Workforce-Portfolio-Review</text></g>
      <g><circle cx="98" cy="674" r="11" fill="#86BC25"/><text x="98" y="679" font-size="12" font-weight="700" fill="#0B1626" text-anchor="middle">8</text>
        <text x="120" y="670" font-weight="700" fill="#F2F7FC">17:00 · Dachgarten <tspan fill="#8AA4C0" font-weight="400">(s10)</tspan></text>
        <text x="120" y="688">Tagesrückblick — kein einziger Fall von Hand</text></g>
    </g>
  </g>

  <!-- ================= Gebäude ================= -->
