<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a8e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" />
  <!-- Open book / education symbol -->
  <g transform="translate(100, 85)" fill="none" stroke="#c4a35a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left page -->
    <path d="M-5,-20 C-5,-20 -40,-25 -45,-15 L-45,20 C-40,10 -5,15 -5,15" fill="#c4a35a" fill-opacity="0.15"/>
    <!-- Right page -->
    <path d="M5,-20 C5,-20 40,-25 45,-15 L45,20 C40,10 5,15 5,15" fill="#c4a35a" fill-opacity="0.15"/>
    <!-- Spine -->
    <line x1="0" y1="-25" x2="0" y2="18" stroke="#c4a35a" stroke-width="2"/>
    <!-- Star above book -->
    <polygon points="0,-40 3,-32 11,-32 5,-27 7,-19 0,-24 -7,-19 -5,-27 -11,-32 -3,-32" fill="#c4a35a" stroke="none"/>
  </g>
  <!-- Text: STIFTUNG -->
  <text x="100" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="3" fill="#c4a35a">STIFTUNG</text>
  <!-- Text: WEBER -->
  <text x="100" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" letter-spacing="4" fill="white">WEBER</text>
  <!-- Subtle line below -->
  <line x1="55" y1="165" x2="145" y2="165" stroke="#c4a35a" stroke-width="1" opacity="0.5"/>
  <!-- Year -->
  <text x="100" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#c4a35a" opacity="0.7">gegr. 2008</text>
</svg>
