  <!-- Haupteingang in der linken Wand -->
  <rect x="450" y="852" width="16" height="52" fill="#0B1626"/>
  <path d="M 464 852 A 52 52 0 0 1 516 904" stroke="#3D5C84" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
  <text x="472" y="928" font-size="11" font-weight="600" fill="#61789A">Haupteingang</text>

