<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMO Toolbox – Transformationsprogramm</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2386BC25'/%3E%3Cstop offset='100%25' stop-color='%2300AA4F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui' font-size='14' font-weight='bold' fill='white'%3EKI%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/pmo-toolbox.css">
    <link rel="stylesheet" href="../css/pmo-modules/pmo-dashboard.css">
    <link rel="stylesheet" href="../css/pmo-modules/pmo-kpi-cards.css">
    <link rel="stylesheet" href="../css/pmo-modules/pmo-valuemap.css">
    <link rel="stylesheet" href="../css/pmo-modules/pmo-warnings.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div id="pmoToolboxModule" class="module-content" style="display:block">
        <!-- Content loaded from partial -->
    </div>

    <script>
    function closePMOToolbox() { window.location.href = getBasePath(); }
    function getBasePath() {
        var p = window.location.pathname;
        var i = p.indexOf('/16_PMOToolbox/');
        return i !== -1 ? p.substring(0, i) + '/' : '/';
    }
    window.safeLocalGet = function(k, f) { try { var v = localStorage.getItem(k); return v !== null ? v : f; } catch(e) { return f; } };
    window.safeLocalSet = function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} };
    </script>

    <script>
    fetch('../partials/pmo-toolbox-module.html')
        .then(r => r.text())
        .then(html => {
            document.getElementById('pmoToolboxModule').innerHTML = html;
            // Load PMO ESM module
            var s = document.createElement('script');
            s.type = 'module';
            s.src = '../js/modules/pmo-toolbox.esm.js';
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
