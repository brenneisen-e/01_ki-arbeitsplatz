<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Billing Check - KI-gestützte Provisionsanalyse">
  <link rel="icon" href="data:,">
  <title>AI Billing Check</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #003366 0%, #0066cc 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .landing-container {
      text-align: center;
      max-width: 600px;
      animation: fadeIn 0.8s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      background: white;
      color: #003366;
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      padding: 2rem 4rem;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      margin-bottom: 3rem;
      display: inline-block;
      animation: logoFloat 3s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    h1 {
      color: white;
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 3rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .start-button {
      background: white;
      color: #003366;
      font-size: 1.5rem;
      font-weight: 700;
      padding: 1.5rem 4rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .start-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      background: #f0f0f0;
    }

    .start-button:active {
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .logo {
        font-size: 3rem;
        padding: 1.5rem 3rem;
      }

      h1 {
        font-size: 2rem;
      }

      .start-button {
        font-size: 1.2rem;
        padding: 1.2rem 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="landing-container">
    <div class="logo">ALPHA</div>
    <h1>AI Billing Check</h1>
    <a href="app.html" class="start-button">Start</a>
  </div>
</body>
</html>
