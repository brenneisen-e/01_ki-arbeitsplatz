  <!-- Fokus-Kabine -->
  <g>
    <rect x="800" y="182" width="182" height="158" rx="10" fill="#142842" stroke="#33517A" stroke-width="1.8"/>
    <text x="891" y="212" font-size="16" font-weight="700" fill="#D5E6F6" text-anchor="middle">Fokus-Kabine</text>
    <text x="891" y="230" font-size="11" fill="#8AA4C0" text-anchor="middle">Process Intelligence · Governance</text>
    <g stroke="#3D5C84" stroke-width="2" fill="none">
      <rect x="856" y="252" width="70" height="40" rx="4"/>
      <path d="M 891 292 L 891 304 M 874 304 L 908 304"/>
