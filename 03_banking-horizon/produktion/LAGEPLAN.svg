    <g><circle cx="1478" cy="364" r="17" fill="#86BC25"/><text x="1478" y="370" fill="#0B1626">8</text>
       <text x="1478" y="396" font-size="14" fill="#F2F7FC" style="paint-order:stroke" stroke="#0B1626" stroke-width="4">17:00</text></g>
  </g>

  <!-- Fußnote -->
  <text x="460" y="1010" font-size="12" fill="#61789A">Grundriss schematisch. Durchgezogene Pfeile: Weg im Erdgeschoss · gestrichelt: Arbeitsweg bzw. Aufzug zur Dachebene.</text>
  <text x="460" y="1030" font-size="12" fill="#61789A">An Station 3 und 7 sitzt Mara am selben Platz — die Inhalte wechseln auf den Bildschirmen, nicht im Raum.</text>
