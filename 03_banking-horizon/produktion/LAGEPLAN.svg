  <path d="M 1380 592 C 1470 566, 1524 500, 1532 424" fill="none" stroke="#86BC25" stroke-width="3.5" stroke-dasharray="9 8" marker-end="url(#pf)"/>
  <text x="1396" y="500" font-size="12" font-weight="600" fill="#86BC25">Aufzug zur</text>
  <text x="1396" y="516" font-size="12" font-weight="600" fill="#86BC25">Dachebene</text>

  <!-- ================= Stationsmarken ================= -->
  <g font-size="16" font-weight="700" text-anchor="middle">
    <g><circle cx="340" cy="878" r="17" fill="#86BC25"/><text x="340" y="884" fill="#0B1626">1</text>
       <text x="368" y="858" font-size="14" fill="#F2F7FC" text-anchor="start" style="paint-order:stroke" stroke="#0B1626" stroke-width="4">07:00</text></g>
    <g><circle cx="720" cy="880" r="17" fill="#86BC25"/><text x="720" y="886" fill="#0B1626">2</text>
