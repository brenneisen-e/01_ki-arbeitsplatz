    <rect x="512" y="196" width="228" height="13" rx="4" fill="#86BC25" opacity="0.75"/>
    <text x="626" y="230" font-size="16" font-weight="700" fill="#D5E6F6" text-anchor="middle">Besprechungsraum</text>
    <text x="626" y="249" font-size="11" fill="#8AA4C0" text-anchor="middle">Agent Workforce Control Room · Breitdisplay</text>
    <ellipse cx="616" cy="330" rx="80" ry="32" fill="none" stroke="#3D5C84" stroke-width="1.8"/>
    <g fill="#3D5C84">
      <circle cx="536" cy="312" r="6"/><circle cx="556" cy="358" r="6"/><circle cx="616" cy="372" r="6"/>
      <circle cx="676" cy="358" r="6"/><circle cx="696" cy="312" r="6"/><circle cx="616" cy="288" r="6"/>
