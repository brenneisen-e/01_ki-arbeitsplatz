    <text x="1151" y="215" font-size="16" font-weight="700" fill="#D5E6F6" text-anchor="middle">Werkraum</text>
    <text x="1151" y="234" font-size="11" fill="#8AA4C0" text-anchor="middle">Risk Assurance Hub</text>
    <g stroke="#3D5C84" stroke-width="2" fill="none">
