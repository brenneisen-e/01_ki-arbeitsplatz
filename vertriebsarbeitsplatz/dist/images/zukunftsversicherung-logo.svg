<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="zv-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a365d"/>
      <stop offset="100%" stop-color="#4a6fa5"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="24" fill="url(#zv-grad)"/>
  <!-- Rising sun / horizon = Zukunft -->
  <circle cx="64" cy="58" r="18" fill="white" opacity="0.85"/>
  <rect x="20" y="58" width="88" height="16" fill="url(#zv-grad)"/>
  <!-- Horizon line -->
  <line x1="24" y1="58" x2="104" y2="58" stroke="white" stroke-width="2" opacity="0.7"/>
  <!-- Light rays -->
  <line x1="64" y1="22" x2="64" y2="34" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="42" y1="28" x2="47" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <line x1="86" y1="28" x2="81" y2="38" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <line x1="30" y1="42" x2="37" y2="48" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="98" y1="42" x2="91" y2="48" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- Shield below horizon = Versicherung/Schutz -->
  <path d="M64 68c0 0 20 4 20 4v18c0 12-8 22-20 28-12-6-20-16-20-28V72s20-4 20-4z" fill="white" opacity="0.25" stroke="white" stroke-width="2" stroke-opacity="0.6" stroke-linejoin="round"/>
  <!-- Checkmark inside shield -->
  <path d="M54 88l7 7 13-14" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
