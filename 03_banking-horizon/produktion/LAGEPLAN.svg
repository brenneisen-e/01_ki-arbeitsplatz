    <text x="926" y="676" font-size="15" font-weight="700" fill="#D5E6F6" text-anchor="middle">Maras Arbeitsplatz</text>
    <text x="926" y="694" font-size="11" fill="#8AA4C0" text-anchor="middle">Prevention · Customer Trust · Evidence</text>
  </g>

  <!-- Aufzug -->
  <g>
    <rect x="1318" y="556" width="60" height="122" rx="8" fill="#142842" stroke="#33517A" stroke-width="1.8"/>
    <g stroke="#3D5C84" stroke-width="2" fill="none">
