    <g><circle cx="822" cy="614" r="17" fill="#86BC25"/><text x="822" y="620" fill="#0B1626">3</text>
       <text x="796" y="560" font-size="14" fill="#F2F7FC" text-anchor="end" style="paint-order:stroke" stroke="#0B1626" stroke-width="4">08:00–08:15</text></g>
    <g><circle cx="734" cy="410" r="17" fill="#86BC25"/><text x="734" y="416" fill="#0B1626">4</text>
       <text x="714" y="450" font-size="14" fill="#F2F7FC" text-anchor="end" style="paint-order:stroke" stroke="#0B1626" stroke-width="4">09:00</text></g>
    <g><circle cx="836" cy="340" r="17" fill="#86BC25"/><text x="836" y="346" fill="#0B1626">5</text>
       <text x="860" y="330" font-size="14" fill="#F2F7FC" text-anchor="start" style="paint-order:stroke" stroke="#0B1626" stroke-width="4">10:30 / 11:15</text></g>
    <g><circle cx="1150" cy="410" r="17" fill="#86BC25"/><text x="1150" y="416" fill="#0B1626">6</text>
       <text x="1176" y="444" font-size="14" fill="#F2F7FC" text-anchor="start" style="paint-order:stroke" stroke="#0B1626" stroke-width="4">14:00</text></g>
    <g><circle cx="1032" cy="614" r="17" fill="#86BC25"/><text x="1032" y="620" fill="#0B1626">7</text>
