    <rect x="80" y="780" width="260" height="170" rx="14" fill="#0F1E33" stroke="#2A4361" stroke-width="2"/>
    <text x="210" y="816" font-size="16" font-weight="700" fill="#D5E6F6" text-anchor="middle">Wohnung</text>
    <text x="210" y="835" font-size="11" fill="#8AA4C0" text-anchor="middle">Küchentisch, Kaffee, Overnight-Briefing</text>
