<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vermittler-Scoring – Risikobewertung & Analyse</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2386BC25'/%3E%3Cstop offset='100%25' stop-color='%2300AA4F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui' font-size='14' font-weight='bold' fill='white'%3EKI%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/shared.css">
    <link rel="stylesheet" href="../css/risikoscoring.css">
</head>
<body>
    <div id="risikoscoringModule" class="module-content" style="display:block">
        <!-- Content loaded from partial -->
    </div>

    <script>
    function closeRisikoscoring() { window.location.href = getBasePath(); }
    function getBasePath() {
        var p = window.location.pathname;
        var i = p.indexOf('/Risikoscoring/');
        return i !== -1 ? p.substring(0, i) + '/' : '/';
    }
    window.safeLocalGet = function(k, f) { try { var v = localStorage.getItem(k); return v !== null ? v : f; } catch(e) { return f; } };
    window.safeLocalSet = function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} };
    </script>

    <script>
    fetch('../partials/risikoscoring-module.html')
        .then(r => r.text())
        .then(html => {
            document.getElementById('risikoscoringModule').innerHTML = html;
            var scripts = ['../js/risikoscoring-data.js', '../js/risikoscoring-ui.js'];
            function loadNext(i) {
                if (i >= scripts.length) { if (typeof initRisikoscoring === 'function') initRisikoscoring(); return; }
                var s = document.createElement('script');
                s.src = scripts[i];
                s.onload = function() { loadNext(i + 1); };
                document.body.appendChild(s);
            }
            loadNext(0);
        });
    </script>
</body>
</html>
