    <path d="M 462 792 H 688" stroke="#86BC25" stroke-width="5"/>
    <path d="M 758 792 H 1378" stroke="#86BC25" stroke-width="5"/>
    <rect x="682" y="776" width="14" height="32" rx="3" fill="#86BC25"/>
    <rect x="750" y="776" width="14" height="32" rx="3" fill="#86BC25"/>
    <text x="1030" y="772" font-size="12" font-weight="600" fill="#86BC25" text-anchor="middle">Check-in-Schranke — Sperrlinie Wand zu Wand, einzige Gasse</text>
