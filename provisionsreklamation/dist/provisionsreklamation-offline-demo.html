Abteilung Provisionsservice`},"RK-2026-0046":{provisionsberechnung:{positionen:[{position:"Bestandsprovision Q3/2025",soll:106.8,ist:28.4,differenz:-78.4},{position:"Bestandsprovision Q4/2025",soll:106.8,ist:28.4,differenz:-78.4},{position:"Bestandsprovision Q1/2026",soll:106.8,ist:28.4,differenz:-78.4}],gesamt_soll:320.4,gesamt_ist:85.2,gesamt_differenz:-235.2},bewertung:{ampel:"orange",titel:"AUFFÄLLIGKEIT — Systematischer Berechnungsfehler in PKV-Bestandsprovision",analyse:`Seit dem Systemupdate im Juli 2025 (Release 4.2.1) wird die Bestandsprovision für PKV-Verträge mit Beitragsanpassungsklausel (BAP) fehlerhaft berechnet.

2. Der angewandte Provisionssatz weicht vom vereinbarten Satz ab (3,25% statt 4,0%) — möglicherweise wurde ein Standard-Satz statt des individuellen Courtagevereinbarungs-Satzes gezogen

**Musteranalyse — 5 weitere, bislang nicht reklamierte Verträge identifiziert:**

- **PKV-2024-718330** (Jana Albrecht) · Vermittlerin Anna Lipp (VM-44906) · geschätzte Nachzahlung **198,40 EUR**
- **PKV-2024-802451** (Familie Ostermeier) · Vermittler Benedikt Ostermeier (VM-51872) · geschätzte Nachzahlung **312,80 EUR**
- **PKV-2025-110988** (Ingrid Falk) · Vermittlerin Ingrid Falk (VM-20345, Eigenvertrag) · geschätzte Nachzahlung **176,20 EUR**
- **PKV-2024-609374** (Paul Rehberg) · Vermittler Paul Rehberg (VM-55710) · geschätzte Nachzahlung **249,50 EUR**

Alle fünf Verträge zeigen exakt dasselbe Fehlerbild (Alt-Beitrag + Standard-Satz). Die Summe der ungemeldeten Nachzahlungen liegt bei **1.168,50 EUR**.`,handlungsempfehlung:`1. Fünf ungemeldete Verträge (PKV-2024-551209, -718330, -802451, PKV-2025-110988, PKV-2024-609374) sofort in die Korrektur aufnehmen

4. Rückstellung für die 6 Fälle (Weber + 5) in Höhe von ca. 1.403 EUR bilden`,auffaelligkeit:{erkannt:!0,muster:"PKV-Bestandsprovision nach BAP fehlerhaft seit Release 4.2.1",geschaetzte_betroffene:"5 weitere Verträge bei anderen Vermittlern — noch nicht reklamiert"}},antwort_entwurf:`Sehr geehrte Frau Weber,
