    <text x="1534" y="204" font-size="16" font-weight="700" fill="#D5E6F6" text-anchor="middle">Dachgarten</text>
    <text x="1534" y="223" font-size="11" fill="#8AA4C0" text-anchor="middle">Dachebene · Reflection &amp; Learning</text>
    <g stroke="#3D5C84" stroke-width="2" fill="none">
